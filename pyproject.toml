[project]
name = "quadruped-demo"
version = "0.1.0"
description = "Small MuJoCo Unitree Go1 quadruped demo with simple gait controllers."
readme = "README.md"
authors = [
    { name = "Yiğit Cankurtaran", email = "yigitcankurtaranyc@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "imageio>=2.37.3",
    "matplotlib>=3.10.9",
    "mujoco>=3.8.0",
    "numpy>=2.4.4",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]

[project.scripts]
quadruped-demo = "quadruped_demo:main"
quadruped-view = "quadruped_demo.env:launch_viewer"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
